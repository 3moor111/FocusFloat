# Publishes a GitHub Release with the APK attached.
# Run it from the Actions tab (Release › Run workflow › type the version, e.g. 3.8),
# or push a tag like v3.8. Needs download/FocusFloat-<version>.apk and
# release-notes/v<version>.md in the repository.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 3.8)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${REF_NAME#v}"; fi
          TAG="v${VERSION}"
          APK="download/FocusFloat-${VERSION}.apk"
          NOTES="release-notes/${TAG}.md"
          test -f "$APK" || { echo "Missing $APK"; exit 1; }
          test -f "$NOTES" || { echo "Missing $NOTES"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "FocusFloat ${VERSION}" --notes-file "$NOTES" --latest

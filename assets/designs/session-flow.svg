  <text x="56" y="116" font-size="34" font-weight="800" fill="#fff" letter-spacing="-1">One session, start to finish.</text>
  <text x="56" y="148" font-size="17" fill="#B9BCC8">Every tool shows up at the moment you need it.</text>
